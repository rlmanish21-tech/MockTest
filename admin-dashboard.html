<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Owner Dashboard | LU Update</title><link rel="stylesheet" href="style.css"><script src="config.js"></script><script type="module" src="app.js"></script></head><body><header class="topbar"><a class="brand" href="index.html">LU <span>UPDATE</span></a><button class="btn secondary" id="admin-logout">Logout</button></header><main class="dashboard"><p class="eyebrow">OWNER WORKSPACE</p><h1>Mock-test management</h1><div id="message" class="status"></div><section class="card section"><h2>Create a course</h2><form id="course-form" class="form-grid"><div class="field"><label for="course-name">Course name</label><input id="course-name" required></div><div class="field"><label for="course-stream">Stream</label><select id="course-stream" required><option>Commerce</option><option>Science</option><option>Arts</option></select></div><button class="btn primary" type="submit">Add course</button></form><div id="courses"></div></section><section class="card section"><h2>Create a test</h2><form id="test-form"><div class="form-grid"><div class="field"><label for="test-title">Test title</label><input id="test-title" required></div><div class="field"><label for="test-course">Course</label><select id="test-course" required></select></div><div class="field"><label for="test-type">Test type</label><select id="test-type"><option value="practice">Practice</option><option value="live">Live</option></select></div><div class="field"><label for="test-duration">Duration (minutes)</label><input id="test-duration" type="number" min="1" max="300" value="90" required></div><div class="field"><label for="test-count">Question count</label><input id="test-count" type="number" min="1" value="100" required></div><div class="field"><label for="test-start">Start time (optional)</label><input id="test-start" type="datetime-local"></div><div class="field"><label for="test-end">End
