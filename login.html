<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Login | LU Update</title><link rel="stylesheet" href="style.css"><script src="config.js"></script><script type="module" src="app.js"></script></head><body><header class="topbar"><a class="brand" href="index.html">LU <span>UPDATE</span></a><a href="register.html">New student? Register</a></header><main class="page"><form class="card" id="login-form"><p class="eyebrow">STUDENT LOGIN</p><h1>Welcome back</h1><p class="muted">Sign in to access your mock tests and results.</p><div id="message" class="status"></div><div class="field"><label for="mobile">Registered mobile number</label><input id="mobile" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" required autocomplete="tel-national"></div><div class="field"><label for="dob">Date of birth</label><input id="dob" type="date" required></div><button class="btn primary full" type="submit">Login</button><p class="small muted">Not registered yet? <a href="register.html">Create an account</a>.</p></form></main><footer>© LU Update</footer></body></html>
